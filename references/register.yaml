  - 'تجنّب تنحنح الحلق (وهو إجراء شائع عند الخطباء)؛ البديل: رشفة ماء.'
  - الترطيب (مشروب دافئ بالعسل، استنشاق بخار) والمرطّب الجوّي في القاعة والبيت.
