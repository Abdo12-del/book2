  isbn: 978-1-47213-996-2
  language: الإنجليزية
  url: https://openlibrary.org/search.json?q=title%3A%22mindset%22+author%3A%22dweck%22
  access: full
  access_note: 'فُتحت صفحة الحقوق وفهرس المحتويات من ملف PDF نفسه: أول نشر أمريكي Random House ٢٠٠٦، غلاف
    صلب Ballantine ٢٠٠٧، أول نشر بريطاني Robinson ٢٠١٢، والطبعة المنقّحة ٢٠١٧ بحقوق © Carol S. Dweck 2017،
    ISBN 978-1-47213-996-2. العنوان المدرَج في رسالتك («The New Psychology of Success») هو عنوان الطبعة
    الأمريكية، أما نسختك فبريطانية منقّحة بعنوان فرعي مختلف.'
  reliability: مهني موثوق
  summary: الكتاب الذي عرّف الجمهور العام بنظرية العقلية (الثابتة مقابل النامية). الأصل البحثي منشور في
    دوريات محكّمة، أمّا الكتاب فعرض تطبيقي موجّه لغير المختصين.
  key_ideas:
  - 'العقلية الثابتة: الاعتقاد بأن القدرة معطى ثابت؛ تجعل الطفل يتجنب التحدي خوفًا من ظهوره بمظهر الضعيف.'
  - 'العقلية النامية: الاعتقاد بأن القدرة تنمو بالجهد والاستراتيجية؛ تجعل الخطأ معلومة لا حكمًا.'
  - 'المديح على الجهد والاستراتيجية لا على الذكاء/الموهبة: «أُعجبني ترتيبك لأفكارك» لا «أنت موهوب».'
  - 'قوة «ليس بعد» (the power of yet): إضافة كلمة «بعد» تحوّل الفشل إلى مرحلة.'
  - 'لغة المدرب نفسها تُنتج العقلية: كلمة «خطأ» مقابل «محاولة أولى».'
  mapping:
  - chapter: 1
    items:
    - 1
    - 3
    - 5
    - 6
    - 7
    reason: الثقة في موقف التحدث مسألة اعتقاد بالقابلية للنمو لا مسألة موهبة؛ والعنصران ٦ (التعامل مع
      الخطأ والتوتر) و٥ (المبادرة) يتحددان عمليًا بنوع المديح الذي يسمعه الطفل.
  quotes_to_verify:
  - صياغة «the power of yet» وموضعها
  - دراسات المديح على الجهد مقابل القدرة المذكورة في الكتاب
  cross_source:
  - S001
  - S020
  - S025
  value_for_trainer: 'قاعدة عملية مباشرة: حوارات المدرب ونماذج العبارات في الفصل يجب أن تُمدح الجهد والاستراتيجية
    لا الموهبة، وأن تُدرج كلمة «بعد» في التغذية الراجعة — وهذا ينسجم تمامًا مع ملاحظتك: «مدح التقدم الفعلي
    لا الموهبة».'
  open_questions:
  - هل توجد ترجمة عربية معتمدة نُشير إليها أم نكتفي بالعنوان الأصلي؟
  drive_file_id: 1TjbGVR0P1aM3SeIvNCX8xrVanraXLwu3
  key_ideas_verified:
  - الفصل ١ «The Mindsets» ويتضمن فقرة «So, What's New?» — من فهرس المحتويات المُستخرَج.
