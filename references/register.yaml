    reason: 'هذا هو المرجع الأساسي لبنية الحديث: تحديد الفكرة الأساسية (١)، المقدمة والمتن والخاتمة (٢)،
      التوسع في الفكرة بدل الانتقال السريع (٥)، تجنب التكرار والتشتت (٦)، تقويم الترابط (٧).'
  quotes_to_verify:
  - قاعدة «فكرة واحدة رئيسية»
  - أنواع الخطافات التي يعددها الكتاب
  - موقفه من حفظ النص مقابل الارتجال
