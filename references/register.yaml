  - شرب الماء بانتظام؛ الانتباه إلى الكافيين لأنه يسبّب الجفاف.
  - فترات راحة صوتية بين الحصص وبعدها، وتجنّب الكلام في الأوقات الصاخبة التي تضطر فيها لرفع الصوت.
