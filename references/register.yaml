  reliability: مهني موثوق
  summary: دليل عملي كتبه مدير مؤتمر TED، يلخّص خبرة أكثر من ألف عرض في قواعد التحضير والبناء والأداء.
    خبرة مؤسسية متراكمة، لا بحثًا محكّمًا.
  key_ideas:
  - فكرة واحدة رئيسية (one major idea) يحملها العرض كله؛ كل ما لا يخدمها يُحذف.
  - 'هيكل ثلاثي: مقدمة تفتح بخطاف، متن مبني على نقاط مترابطة، خاتمة تُغلق الدائرة.'
  - 'أدوات الخطاف: سؤال، قصة، مفارقة، صورة؛ تُفتتح بها أول ٣٠ ثانية.'
  - 'الاتصال قبل المحتوى: الجمهور يقرّر استقباله لك قبل أن يقرّر استقبال فكرتك.'
  - التحضير المكتوب ثم التدريب حتى الاستيعاب — لا ورقة تُقرأ ولا ارتجال بلا بنية.
  - تجنب المصطلحات والتفريعات الكثيرة؛ الوضوح يسبق الأناقة.
