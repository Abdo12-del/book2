  type: كتاب
  title: 'The Whole-Brain Child: 12 Revolutionary Strategies to Nurture Your Child''s Developing Mind'
  title_ar: الطفل كامل الدماغ
  author: Daniel J. Siegel & Tina Payne Bryson
  translator: —
  publisher: 'Robinson (Little, Brown Book Group / Hachette UK)؛ الأصل الأمريكي: Delacorte Press ٢٠١١'
  year: '2011'
  edition: النسخة البريطانية (Robinson) ٢٠١٢ — وهذه هي النسخة المرفوعة فعليًا
  isbn: 978-1-78033-837-8
  language: الإنجليزية
  url: https://openlibrary.org/search.json?q=title%3A%22whole-brain+child%22
  access: full
  access_note: 'فُتحت صفحة الحقوق وفهرس المحتويات من ملف PDF نفسه في هذه الجلسة: أول نشر أمريكي Delacorte
    Press ٢٠١١، وأول نشر بريطاني Robinson ٢٠١٢، ISBN 978-1-78033-837-8. تنبيه: النسخة مسحوبة ضوئيًا (رقمنها
    Internet Archive سنة ٢٠٢٤) ونصّها المُستخرَج فيه أخطاء تعرّف ضوئي، فالاستشهاد بالصفحة ممكن أما النقل
    الحرفي فيحتاج مراجعة الصورة.'
  reliability: مهني موثوق
  summary: كتاب توجيهي للآباء والمربّين يبسّط مفاهيم علوم الأعصاب التربوية إلى اثنتي عشرة إستراتيجية عملية
    للتعامل مع انفعالات الطفل وتنظيمها. مؤلفاه طبيب نفسي للأطفال ومعالجة تربوية.
  key_ideas:
  - 'تسمية الانفعال تُخفف حدّته: «سمِّه لتروّضه» (Name it to tame it) — الانتقال من الانفعال إلى الوصف
    اللغوي.'
  - '«السلم العقلي»: الدماغ العلوي (التفكير والتخطيط) والسفلي (الانفعال والبقاء)؛ الطفل المتوتر يعمل من
    الأسفل.'
  - 'الربط قبل التوجيه (Connect and Redirect): لا تُصلح السلوك قبل أن يشعر الطفل بأنه مفهوم.'
  - 'الدمج بين نصفي الدماغ: ربط التجربة الانفعالية بالسرد المنطقي يسهّل تذكرها والتعبير عنها.'
  - 'الذاكرة الضمنية مقابل الصريحة: خبرات التحدث المخيفة القديمة تعمل ضمنيًا وتظهر كخجل بلا سبب ظاهر.'
  - 'التدرّج في التعرّض: التعرض المتكرر المتدرج للموقف المخيف يبني التحمّل.'
  mapping:
  - chapter: 1
    items:
    - 1
    - 2
    - 3
    - 6
    - 7
    reason: يعالج جذور الخجل والتردد بوصفها استجابة انفعالية لا نقصًا في المهارة، ويقدّم آلية عملية (التسمية
      + التدرج في المواجهة) تناسب العناصر ٢ و٣ و٦ من الفصل.
  quotes_to_verify:
  - مفهوم «Name it to tame it» وموضعه في الكتاب
  - مفهوم «السلم العقلي / upstairs-downstairs brain»
  - عدد الإستراتيجيات (١٢) وعناوينها
  cross_source:
  - S002
  - S025
  - S026
  value_for_trainer: 'يعطي المدرب تفسيرًا غير أخلاقي لخجل الطفل: التردد ليس «كسلًا» أو «ضعف شخصية» بل
    استجابة جهاز عصبي لموقف يُقرأه كتهديد. هذا يغيّر طريقة تعامل المدرب مع المتردد: تسمية المشاعر أولًا،
    ثم التدرج، لا الحثّ العام على «الشجاعة».'
  open_questions:
  - هل تُستخدم أمثلة الكتاب (آباء/أطفال في البيت) مباشرة أم تُعاد صياغتها لسياق حلقة تدريبية؟
  - مدى إمكانية نقل «الذاكرة الضمنية» إلى شرح مبسّط للمدرب دون تبسيط مُخلّ.
  drive_file_id: 1Y3yJJlCGrJBlJk2OrR_2EtRZNpnC0mls
  key_ideas_verified:
  - الفصل ١ «Parenting with the Brain in Mind» ص ٣ — من فهرس المحتويات المُستخرَج.
  - الفصل ٢ «Two Brains Are Better Than One» ص ١٤، ويضمّ الإستراتيجية ١ «Connect and Redirect» والإستراتيجية
    ٢ «Name It to Tame It» — وهو ما يؤكد فكرتين سجّلتُهما سابقًا من الذاكرة.
  - الفصل ٣ «Building the Staircase of the Mind» ص ٣٧ (الدماغ العلوي/السفلي) — يؤكد فكرة «السلم العقلي».
  - الفصل ٤ «Kill the Butterflies!» ص ٦٦ (الذاكرة).
