  reliability: علمي محكّم
  summary: 'كتاب جامعي مرجعي في نمو اللغة عند الطفل: مراحل النمو الصوتي والصرفي والنحوي والدلالي والتداولي،
    والعوامل المؤثرة فيه.'
  key_ideas:
  - 'النمو اللغوي يتدرج في مستويات: الصوت، الصرف، النحو، الدلالة، الاستعمال التداولي.'
  - اللغة الاستقبالية (الفهم) تتقدّم على اللغة التعبيرية (الإنتاج) — الطفل يفهم أكثر مما يقول بكثير.
  - 'المرحلة العمرية تحدد سقف التوقع: توقع جملة مركّبة من طفل في السادسة توقع غير واقعي.'
  - المدخلات اللغوية ونوعية التفاعل (لا مجرد الكم) تتنبأ بنمو المفردات والتراكيب.
  - الفروق الفردية في وتيرة النمو واسعة وطبيعية في المدى المنطقي.
