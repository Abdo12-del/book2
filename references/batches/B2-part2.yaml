  access_note: قرأتُ الملخّص والوصف التفصيلي المنقول عن الدراسة في مصادر ثانوية؛ النصّ الكامل لم يُفتح.
  reliability: علمي محكّم
  summary: مراجعة لتقليد بحثي يُدرّب الأطفال على عناصر القصة (story grammar) وإعادة السرد بأدوات بصرية،
    ويقيس أثره في اللغة المركّبة.
  key_ideas:
  - 'عناصر القصة المدروسة: الشخصية، والمشكلة، والاستجابة الداخلية، والحدث/الفعل، والنتيجة.'
  - التدريب المباشر على عناصر القصة مع التدريب على إعادة السرد فعّال في رفع جودة السرد لدى أطفال من خلفيات
    لغوية مختلفة.
  - الإسناد اللفظي مع إسناد غير لفظي (تمثيل القصة أو استخدام مجسّمات) يزيد تحسّن التعبير السردي.
  - مهارة السرد تنتقل إلى الفهم القرائي والكتابة، فليست غاية في نفسها.
