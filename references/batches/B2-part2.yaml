  title_ar: 'الخطاب التداولي: حديث المساءلة في الصف والحياة المدنية'
  author: Sarah Michaels, Catherine O'Connor, Lauren B. Resnick
  publisher: 'Studies in Philosophy and Education، 27(4)، 283–297 — DOI: 10.1007/s11217-007-9071-1'
  year: '2008'
  language: الإنجليزية
  url: https://link.springer.com/article/10.1007/s11217-007-9071-1
  access: partial
  access_note: قرأتُ الملخّص والتعريفات المنقولة في مصادر ثانوية محكّمة (الأبعاد الثلاثة وحركات الحديث)؛
    النصّ الكامل لم يُفتح.
  reliability: علمي محكّم
  summary: 'الإطار المرجعي لـ«حديث المساءلة»: ثلاثة التزامات تحدد جودة الحوار الصفّي، مع حركات حديث عملية
    يمارسها المعلم والأطفال.'
  key_ideas:
  - 'المساءلة ثلاثة: المساءلة لمجتمع المتعلّمين، وللمعرفة الدقيقة المناسبة، ولمعايير التفكير الصارمة.'
  - 'حركات الحديث العملية: إعادة الصياغة (revoicing)، وطلب توسيع الفكرة، وطلب تطبيق تفكير الطفل على فكرة
    غيره، والسؤال: «مَن يستطيع أن يضيف؟».'
  - الهدف ليس أن يُجيب الطفل إجابة صحيحة، بل أن يُسنِد ويسائل ويتحمّل مسؤولية ما يقول.
  - حديث المساءلة يبني عادات مدنية لا مجرد مهارات صفّية.
