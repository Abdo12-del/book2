  reliability: علمي محكّم
  summary: تحليل بعدي لـ142 دراسة (176 حجم أثر) يستخرج أحد عشر عنصرًا تعليميًا ذات أثر ذي دلالة في جودة
    الكتابة — وأكثرها ينطبق على التعبير الشفهي المنظّم أيضًا.
  key_ideas:
  - 'تدريس الإستراتيجيات (تخطيط/مراجعة/تحرير) أكبر أثر: 0.82 (وللطلاب المتأخرين 1.02).'
  - 'دمج الجمل (sentence combining) أثره 0.50: تدريب الطفل على ضمّ جملتين بسيطتين في جملة أغنى.'
  - تلخيص النصوص عنصر ذو أثر مؤكّد، وهو أساس «التقارير الشفهية» و«نقل المعلومة».
  - 'أدوار أخرى مؤكّدة: تحديد أهداف منتج واضحة، ودراسة نماذج جيدة، والكتابة كأداة تعلّم في المواد كلها.'
