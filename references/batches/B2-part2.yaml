  reliability: علمي محكّم
  summary: عرض لبرنامج «التفكير معًا» الذي يدرّب الأطفال على قواعد الحوار الاستكشافي، وقياس أثره في مهارات
    الاستدلال.
  key_ideas:
  - 'قواعد الحوار الاستكشافي: مشاركة المعلومات، وتشجيع مشاركة الجميع، والإنصات، والنظر في كل اقتراح، وطلب
    الأسباب، وتقبّل التحدّي البنّاء، والسعي للاتفاق.'
  - أضاف البرنامج قواعد حديث صفّية يُتفق عليها مع الأطفال لا تُفرض عليهم.
  - الأثر ظهر في اختبارات الاستدلال بفروق تُقارب ما بين صفّين دراسيين عند ضبط النمو الطبيعي.
  - 'من قواعد البرنامج سؤال موجه للهادئ لرفع المشاركة: «ما رأيك أنت؟» وقد يُنشئ قادة أقرانًا.'
