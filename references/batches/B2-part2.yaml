  reliability: علمي محكّم
  summary: 'تجربة ضابطة على طلاب الصف الثامن: مَن طُلب منه أن يشرح لنفسه بعد كل سطر فهم أكثر ممّن أعاد
    القراءة مرتين، وارتبط الفهم بكمية الشروح المُنتَجة.'
  key_ideas:
  - الشرح الذاتي (self-explanation) يُحسّن الفهم حتى دون تدريب مسبق على مهارة الشرح.
  - مَن أنتج شروحًا أكثر (high explainers) بلغ الفهم الأعمق ووصل إلى النموذج الذهني الصحيح.
  - 'آلية الفائدة ثلاثية: بنائية (يستنتج ما لم يُقَل)، ودمجية (يصل الجديد بالمعرفة السابقة)، وتصحيحية
    (يكتشف الخطأ ويصحّحه).'
  - 'الشرح لا يخدم المستمع فقط: قائله يفهم أكثر — وهذا سند نظري لجعل الشرح نشاطًا صفّيًا لا عرضًا للمعلم.'
