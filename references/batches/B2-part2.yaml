  title_ar: استخدام التدخّل السردي لتسريع نُظم القصة النموذجية ونموّ اللغة المركّبة
  author: Douglas B. Petersen, Trina D. Spencer
  publisher: Topics in Language Disorders، 36(1)، 6–19
  year: '2016'
  language: الإنجليزية
  url: https://www.researchgate.net/publication/292336434
