  title_ar: 'السرد الشفهي في الصف: فوائد في القراءة والكتابة والنمو الاجتماعي'
  author: Trina D. Spencer وزماؤها
  publisher: 'The Reading Teacher (Wiley) — DOI: 10.1002/trtr.2144'
  year: '2023'
  language: الإنجليزية
  url: https://ila.onlinelibrary.wiley.com/doi/10.1002/trtr.2144
