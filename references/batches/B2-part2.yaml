  title_ar: استدعاء الشرح الذاتي يُحسّن الفهم
  author: Michelene T. H. Chi, Nicholas de Leeuw, Mei-Hung Chiu, Christian LaVancher
  publisher: 'Cognitive Science، 18(3)، 439–477 (Wiley) — DOI: 10.1207/s15516709cog1803_3'
