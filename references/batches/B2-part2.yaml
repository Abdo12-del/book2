  access_note: الورقة متاحة علنًا (PDF). قرأتُ مقتطفات مطوّلة ومسندة عبر البحث، ولم أقرأها صفحةً بصفحة.
  reliability: علمي محكّم
  summary: ورقة مرجعية تُلخّص تراكم أكثر من عشرين دراسة كبرى في الحديث الصفّي، وتُصنّف أنواع «حديث التعلّم»
    و«حديث التعليم»، وتؤسّس لمبدأ أن الحديث ليس وعاءً للتعلم بل آلية منه.
  key_ideas:
  - الحديث عالي الجودة يرفع التحصيل في المواد الأساسية بحسب أكثر من 20 دراسة دولية كبرى.
  - 'يُعدّ أليكساندر عشرة أنواع من حديث التعلّم: السرد، والشرح، والاستدلال، والتخيّل، والتساؤل، والاستكشاف،
    والتقويم، والمناقشة، والمجادلة، والتبرير.'
  - 'خمسة أنواع لحديث التعليم: التلقين (rote) والتسميع (recitation) والتعليم (instruction) والمناقشة (discussion)
    والحوار (dialogue).'
  - الأسئلة منخفضة المستوى (التي تُطلب جوابًا واحدًا محدّدًا) تُقيّد مشاركة الأطفال وتُفقر الحوار.
  - 'مبادئ الحوار التعليمي: جماعي، تبادلي، داعم، تراكمي (chain of enquiry)، وهادف.'
