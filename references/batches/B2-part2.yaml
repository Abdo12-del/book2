  access_note: قرأتُ الملخّص الكامل والبنية العامة للمقال ومصادره المفتاحية؛ النصّ الكامل خلف اشتراك.
  reliability: علمي محكّم
  summary: مراجعة تُجمع أدلة تجريبية على أن السرد الشفهي نشاط صفّي متعدد الفوائد، وتعرض سبع إستراتيجيات
    لدمجه، وتُبيّن أنه مفيد لكل الأطفال وأساسي لبعضهم.
  key_ideas:
  - فهم المسموع يتنبّأ بفهم المقروء، والتعبير الشفهي يُغذّي الكتابة.
  - السرد الشفهي قابل للتدريب بلا نصّ مكتوب، فهو متاح للأطفال الذين لم يتقنوا فك الرموز بعد.
  - المهارات اللغوية الشفهية المبكرة من أقوى المنبئات بالمهارات الاجتماعية اللاحقة، وصعوبة التعبير ترتبط
    بمشكلات سلوكية.
  - المقال يعرض سبع إستراتيجيات لدمج السرد الشفهي في الصف بدل اعتباره نشاطًا هامشيًا.
